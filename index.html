<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>漫画グレー塗り v2（原稿なし）</title><style>body{font-family:-apple-system,sans-serif;background:#f3f3f3;margin:0;color:#222}header{background:white;padding:12px;position:sticky;top:0;z-index:5;box-shadow:0 1px 5px #aaa}button,input{font-size:16px}button{padding:9px;border:1px solid #aaa;border-radius:7px;background:white;margin:3px}#wrap{overflow:auto;height:73vh;touch-action:pan-x pan-y;background:#ddd}canvas{display:block;margin:auto;max-width:100%;height:auto;touch-action:manipulation}small{color:#555}input[type=range]{width:150px}</style><header><strong>漫画グレー塗り v2（原稿なし）</strong>　<small>線画は変更しません</small><div>グレー <input type=range id=g min=0 max=100 value=35><b id=val>35%</b>　<button id=undo>戻す</button><button id=clear>全消去</button></div><div><button id=save>透過PNGを保存</button><label>別の原稿 <input type=file id=file accept="image/png,image/jpeg" style="max-width:140px"></label></div><small id=status>原稿を選択してください。画像は端末内で処理され、サーバーに送信されません。</small></header><div id=wrap><canvas id=view></canvas></div><script>
const src=new Image();const cv=document.getElementById('view'),ctx=cv.getContext('2d',{willReadFrequently:true});const slider=document.getElementById('g'),val=document.getElementById('val'),status=document.getElementById('status');let W,H,base,mask,history=[];const off=document.createElement('canvas'),oc=off.getContext('2d',{willReadFrequently:true});const temp=document.createElement('canvas'),tc=temp.getContext('2d');slider.oninput=()=>val.textContent=slider.value+'%';function init(im){W=im.naturalWidth;H=im.naturalHeight;cv.width=off.width=temp.width=W;cv.height=off.height=temp.height=H;oc.drawImage(im,0,0,W,H);base=oc.getImageData(0,0,W,H);mask=new Uint8Array(W*H);history=[];draw();status.textContent=`${W}×${H} px。服の中をタップしてください。`;}function draw(){ctx.putImageData(base,0,0);const a=tc.createImageData(W,H),v=Math.round(255*(1-slider.value/100));for(let i=0;i<mask.length;i++)if(mask[i]){let j=i*4;a.data[j]=v;a.data[j+1]=v;a.data[j+2]=v;a.data[j+3]=180;}tc.putImageData(a,0,0);ctx.drawImage(temp,0,0);}slider.addEventListener('change',draw);
// 塗り境界は明度で判定。白領域の連結成分だけ選ぶ。巨大領域は誤塗り防止。
function fill(x,y){let start=y*W+x,d=base.data;function ok(i){let j=i*4;return d[j]>170&&d[j+1]>170&&d[j+2]>170;}if(!ok(start)){status.textContent='線の上です。服の白い部分をタップしてください。';return;}let seen=new Uint8Array(W*H),q=new Int32Array(W*H),n=1,head=0;q[0]=start;seen[start]=1;let limit=Math.floor(W*H*.13);while(head<n&&n<limit){let i=q[head++],xx=i%W;let ns=[i-W,i+W];if(xx>0)ns.push(i-1);if(xx<W-1)ns.push(i+1);for(const z of ns)if(z>=0&&z<W*H&&!seen[z]&&ok(z)){seen[z]=1;q[n++]=z;}}if(n>=limit){status.textContent='領域が広すぎるため中止。線に隙間がある可能性があります。';return;}history.push(mask.slice());if(history.length>8)history.shift();for(let i=0;i<n;i++)mask[q[i]]=1;draw();status.textContent=`${n.toLocaleString()}ピクセルの領域を追加しました。`;}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();fill(Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)*W/r.width))),Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)*H/r.height))));});document.getElementById('undo').onclick=()=>{if(history.length){mask=history.pop();draw();}};document.getElementById('clear').onclick=()=>{history=[];mask.fill(0);draw();};document.getElementById('save').onclick=()=>{let out=document.createElement('canvas');out.width=W;out.height=H;let c=out.getContext('2d'),im=c.createImageData(W,H),v=Math.round(255*(1-slider.value/100));for(let i=0;i<mask.length;i++)if(mask[i]){let j=i*4;im.data[j]=im.data[j+1]=im.data[j+2]=v;im.data[j+3]=255;}c.putImageData(im,0,0);out.toBlob(blob=>{let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='服グレー塗り_別レイヤー.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),20000);},'image/png');};document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{init(im);URL.revokeObjectURL(u);};im.src=u;};status.textContent='原稿は組み込まれていません。「別の原稿」からPNG/JPEGを選んでください。';
</script></html>
